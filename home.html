<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>milindCal - Your Calendar, Email, and To-Do List App</title>
    <link rel="stylesheet" href="style1.css"> <!-- This line links your CSS file -->
    <!-- Add more CSS links or JS links here if needed -->
</head>


<body>
    <header>
        <h1>milindCal</h1>
        <nav>
            <ul>
                <li><a href="#calendar-section">Calendar</a></li>
                <li><a href="#email-section">Email</a></li>
                <li><a href="#todo-section">To-Do List</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <!-- Calendar Section -->
        <section id="calendar-section">
            <h2>Calendar</h2>
            <div id="calendar-container">
                <!-- Calendar goes here -->
            </div>
        </section>

        <!-- Email Section -->
        <section id="email-section">
            <h2>Email</h2>
            <div id="email-container">
                <!-- Email client goes here -->
            </div>
        </section>

        <!-- To-Do List Section -->
        <section id="todo-section">
            <h2>To-Do List</h2>
            <div id="todo-container">
                <!-- To-Do list goes here -->
                <ul id="todo-list">
                    <!-- List items get added here -->
                </ul>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2024 My Productivity App</p>
    </footer>

    <!-- Add your JavaScript links here -->
</body>

</html>
